<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Eden Archive Admin{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/htmx-sse.js" defer></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Eden Archive <span>admin</span></a>
  <nav>
    <a href="/" class="{{ 'on' if nav == 'dashboard' }}">Dashboard</a>
    <a href="/worlds" class="{{ 'on' if nav == 'worlds' }}">Worlds</a>
    <a href="/assets" class="{{ 'on' if nav == 'assets' }}">Assets</a>
    <a href="/jobs" class="{{ 'on' if nav == 'jobs' }}">Jobs</a>
    <a href="/tags" class="{{ 'on' if nav == 'tags' }}">Tags</a>
    <a href="/dupes" class="{{ 'on' if nav == 'dupes' }}">Dupes</a>
    <a href="/content" class="{{ 'on' if nav == 'content' }}">Content</a>
  </nav>
  <div class="local">local · 127.0.0.1</div>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer>
  Writes files into the working tree only — review with <code>git diff</code>, then commit and push yourself.
</footer>
</body>
</html>
